<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Management Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f3; --card:#ffffff; --ink:#1b2426; --muted:#5d6a6c; --faint:#8a9497; --line:#e2e5e0; --line-strong:#cfd4ce;
  --accent:#0e5c62; --accent-ink:#0a4549; --accent-soft:#e2eff0; --accent-mid:#4e9196; --accent-light:#a8cfd2;
  --red:#b3232d; --red-soft:#fbe9ea; --red-line:#f0c3c6;
  --amber:#8f5a00; --amber-soft:#fff2d4; --amber-line:#f3d896;
  --green:#1f7a3f; --green-soft:#e3f3e8; --green-line:#b9e0c4;
  --grey:#636b70; --grey-soft:#eef0f1; --grey-line:#d7dbde;
  --purple:#5b3f9e; --purple-soft:#efeaf9;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,30,.05),0 1px 1px rgba(20,30,30,.03);
  --nav-w:224px; --top-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px} h4{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}

/* shell */
.nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand .t{font-weight:600;font-size:14px;line-height:1.15}
.brand .s{font-size:11.5px;color:var(--muted)}
.nav a.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.nav a.item:hover{background:var(--grey-soft)}
.nav a.item.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav a.item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .sec{margin:18px 10px 6px}
.nav a.pt{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px}
.nav a.pt:hover{background:var(--grey-soft)}
.nav a.pt.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav a.pt .rk{width:18px;height:18px;border-radius:5px;background:var(--grey-soft);color:var(--muted);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.nav a.pt.active .rk{background:var(--accent);color:#fff}
.nav .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.top{position:fixed;left:var(--nav-w);right:0;top:0;height:var(--top-h);background:rgba(245,246,243,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:10px;z-index:15;font-size:13.5px}
.top .dot{color:var(--faint)}
.top .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.top .pill.alert{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber)}
.top .grow{flex:1}
main{margin-left:var(--nav-w);padding:calc(var(--top-h) + 18px) 28px 120px;max-width:1440px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{text-decoration:underline}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--grey-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green);cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;line-height:1.5;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.chip.ai{background:var(--purple-soft);color:var(--purple);border-color:#d9cff0}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.green{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.grey{background:var(--grey-soft);color:var(--grey);border-color:var(--grey-line)}
.chip.teal{background:var(--accent-soft);color:var(--accent-ink);border-color:#bcd9db}
.chip.purple{background:var(--purple-soft);color:var(--purple);border-color:#d9cff0}
.chip.wrap{white-space:normal;line-height:1.35;padding:3px 9px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:6px}
[data-tip]{cursor:help}
.tip{position:fixed;z-index:100;max-width:340px;background:#1b2426;color:#fff;font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;display:none;white-space:pre-line}
.pop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,20,.15);padding:14px 16px;width:420px;font-size:13px;line-height:1.5}
.pop h3{margin-bottom:6px}
.pop .close{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:16px;color:var(--muted)}
.pop ul{margin:4px 0 10px 18px;padding:0} .pop li{margin:2px 0}
.bar{height:8px;background:var(--grey-soft);border-radius:999px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .time{background:var(--accent)} .bar .acuity{background:var(--accent-mid)} .bar .data{background:var(--accent-light)}
.cbar{height:8px;background:var(--grey-soft);border-radius:999px;overflow:hidden}
.cbar>i{display:block;height:100%;transition:width .5s ease}
.c-red>i{background:var(--red)} .c-amber>i{background:#d99a1e} .c-green>i{background:var(--green)}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend b{color:var(--ink);font-weight:600}
.legend .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.hl td{background:#fff8ec}
tr.dim td{color:var(--faint)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#1b2426;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:all .25s;z-index:90;max-width:640px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px}

/* queue */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 18px}
.stat{padding:14px 16px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.warn .v{color:var(--red)}
.qbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;cursor:pointer}
.qcard{display:grid;grid-template-columns:44px 1.25fr 1.1fr .9fr 1.4fr;gap:18px;padding:16px 18px;align-items:start;margin-bottom:10px;position:relative}
.qcard.week{opacity:.85;background:#fbfbf9}
.rank{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.qcard.week .rank{background:var(--grey)}
.qcard .nm{font-size:16px;font-weight:600;line-height:1.2}
.qcard .nm a{color:inherit;text-decoration:none} .qcard .nm a:hover{text-decoration:underline}
.qcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
.lab b{color:var(--ink);font-size:13px;letter-spacing:0;text-transform:none}
.dl{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.dl.hot{color:var(--red)} .dl.warm{color:var(--amber)}
.dl-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.nba{font-size:13.5px;line-height:1.45}
.nba .act{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* member */
.m360{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}
.idh{padding:12px 18px}
.idh .nm{font-size:20px;font-weight:600;letter-spacing:-.01em}
.idh .meta{font-size:13px;color:var(--muted);margin-top:4px}
.idh .meta b{color:var(--ink);font-weight:500}
.idh .phones{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;align-items:center}
.idh .phones .ph{display:inline-flex;align-items:center;gap:6px}
.idh .phones .ph .n{font-weight:500}
.lead{padding:12px 18px;margin-top:10px;border-left:4px solid var(--accent)}
.lead p.txt{font-size:14.5px;line-height:1.5;margin-top:6px}
.conf{padding:9px 18px;margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.conf .n{font-size:22px;font-weight:600;min-width:42px;text-align:right;letter-spacing:-.02em}
.conf .n.red{color:var(--red)} .conf .n.amber{color:var(--amber)} .conf .n.green{color:var(--green)}
.conflicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
.cc{padding:10px 12px;border-left:4px solid var(--amber);display:flex;flex-direction:column;gap:6px}
.cc.high{border-left-color:var(--red)} .cc.low{border-left-color:var(--grey)}
.cc.done{border-left-color:var(--green);background:#f7fcf8} .cc.gone{opacity:.55;border-left-color:var(--grey)}
.cc .src{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:11.5px}
.cc .src>div{background:var(--grey-soft);border-radius:6px;padding:4px 7px;line-height:1.3}
.cc .src>span{color:var(--faint);font-size:11px}
.cc .txt{font-size:13px;font-weight:500;line-height:1.35}
.cc .sug{font-size:12px;color:var(--muted);line-height:1.35}
.cc .sug b{color:var(--ink);font-weight:500}
.sig{padding:8px 18px;margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sig ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;flex:1}
.sig li{display:flex;gap:8px;align-items:center;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabpanel{padding:16px 20px;margin-top:12px}
.feed{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:8px 12px;background:var(--grey-soft);border-radius:8px;margin-bottom:12px}
.feed b{color:var(--ink);font-weight:500}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:6px 118px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.tl li:last-child{border-bottom:0}
.tl .band{width:6px;border-radius:3px;align-self:stretch;min-height:36px}
.band.g{background:var(--green)} .band.a{background:#d99a1e} .band.x{background:#b9c0c4} .band.p{background:repeating-linear-gradient(0deg,#cfd4d7 0 4px,transparent 4px 8px)}
.tl .when{font-size:12.5px;line-height:1.4}
.tl .when b{font-weight:600;display:block}
.tl .when span{color:var(--muted);display:block;font-size:11.5px}
.tl .what{font-size:13.5px;line-height:1.45}
.tl .what .d{color:var(--muted);font-size:12.5px}
.tl li.pending .what,.tl li.pending .when{color:var(--faint)}
.tl li.pending .what .d{color:var(--faint)}
.tl li.newborn .what{background:#f3f0fb;border-radius:6px;padding:6px 9px;border:1px dashed #cfc2ea}
.kind{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);background:var(--grey-soft);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;border:1px solid}
.banner.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.banner.amber{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.banner.grey{background:var(--grey-soft);border-color:var(--grey-line);color:var(--muted)}
.doc{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.doc .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.doc .c{font-size:13px;line-height:1.55;margin-top:6px;color:#2b3537}
.gap{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.gap:last-child{border-bottom:0}
.gap .t{font-weight:500;font-size:13.5px}
.gap .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.gap .due{text-align:right;font-size:12.5px;white-space:nowrap}
.gap .due b{display:block;font-size:14px;font-weight:600}
.note{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13.5px;line-height:1.5}
.note .h{font-size:12px;color:var(--muted);margin-bottom:3px}
.rail{position:sticky;top:calc(var(--top-h) + 20px);display:flex;flex-direction:column;gap:12px}
.rail .card{padding:14px 16px}
.rail .nbatxt{font-size:14px;line-height:1.5;margin:6px 0 8px;font-weight:500}
.rail .why{font-size:12.5px;color:var(--muted)}
.reach .num{font-size:20px;font-weight:600;letter-spacing:-.01em}
.reach ul{margin:6px 0 0 16px;padding:0;font-size:12.5px;color:var(--muted)}
.rail .acts{display:flex;flex-direction:column;gap:8px}
.rail .acts .btn{justify-content:center}

/* outreach */
.o3{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,.95fr) minmax(0,1.3fr);gap:16px;align-items:start}
.o3 .card{padding:14px 16px}
.numcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative}
.numcard.best{border-color:var(--accent);background:#f3f9f9;box-shadow:inset 3px 0 0 var(--accent)}
.numcard.dead{opacity:.7}
.numcard .n{font-size:17px;font-weight:600;letter-spacing:-.01em}
.numcard .sc{font-size:12px;color:var(--muted)}
.numcard .sc b{font-size:14px;color:var(--ink)}
.numcard ul{margin:6px 0 0 16px;padding:0;font-size:12.5px;color:var(--muted)}
.numcard ul li.neg{color:var(--red)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:72px;line-height:1.45}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.locked{position:relative;min-height:240px}
.locked .veil{position:absolute;inset:0;background:rgba(245,246,243,.85);display:grid;place-items:center;text-align:center;padding:20px;border-radius:var(--radius);font-size:13.5px;color:var(--muted);z-index:2}
.tp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.tp:last-child{border-bottom:0}
.tp input{margin-top:4px;flex:none;width:16px;height:16px;accent-color:var(--accent)}
.tp .src{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
details.sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details.sec summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;font-weight:600;border-radius:8px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.sec[open] summary::before{transform:rotate(45deg)}
details.sec summary:hover{background:var(--grey-soft)}
details.sec summary .sc{font-size:12px;font-weight:500;color:var(--muted)} details.sec summary .sc.done{color:var(--green)}
details.sec summary .grow{flex:1}
details.sec .fld{padding:7px 12px}
.fld{padding:8px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.fld .k{font-size:12px;font-weight:600;color:var(--muted)}
.fld .v{display:flex;flex-direction:column;gap:3px}
.fld .v textarea{font-size:13px;padding:6px 9px;min-height:0;line-height:1.4}
.fld .v .srcl{font-size:11px;color:var(--faint)}
.fld.ok .v textarea{background:var(--green-soft);border-color:var(--green-line)}
.callnote{background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:90px;color:#2b3537}
.counter{font-size:12.5px;color:var(--muted)}
.counter b{color:var(--ink)}

/* drawer */
.drawer{position:fixed;left:var(--nav-w);right:0;bottom:0;background:#fff;border-top:1px solid var(--line-strong);box-shadow:0 -6px 20px rgba(10,20,20,.08);z-index:18;transition:transform .25s ease}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:8px 28px;border:0;background:transparent;width:100%;text-align:left;font-size:13px;font-weight:500}
.drawer .dh .cnt{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.drawer .body{max-height:220px;overflow:auto;padding:0 28px 14px;display:none}
.drawer.open .body{display:block}
.drawer table td{padding:6px 10px;font-size:12.5px}
.drawer .body .empty{padding:14px}
.chev{transition:transform .2s;display:inline-block}
.drawer.open .chev{transform:rotate(180deg)}

/* ---------- app state (in-memory; reload resets) ---------- */

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pd = s => s ? new Date(String(s).replace(' ', 'T')) : null;

function penaltyOf(c) { return c.type === 'identity' ? 10 : 20; }
function conflictState(pid) { const q = byId(pid); if (!App.conflicts[pid]) App.conflicts[pid] = q.conflicts.map(() => 'open'); return App.conflicts[pid]; }
function liftFor(pid, idx) {
  const q = byId(pid); const total = q.conflicts.reduce((a, c) => a + penaltyOf(c), 0); const applied = Math.min(40, total);
  return total ? penaltyOf(q.conflicts[idx]) / total * applied : 0;
}
function confidence(pid) {
  const q = byId(pid); const st = conflictState(pid); let lift = 0;

function openGaps(pid) { return rows('care_gaps', byId(pid).linked_ids).filter(g => !/^(closed|met|completed)/i.test(g.status)); }

  const up = gaps.filter(g => g.diff >= 0).sort((a, b) => pd(a.due_datetime || a.due_date) - pd(b.due_datetime || b.due_date) || a.days_left - b.days_left);
  const overdue = gaps.filter(g => g.diff < 0).sort((a, b) => a.diff - b.diff);
  const h = q.hours_to_nearest_window; const hasWindow = typeof h === 'number' && h < 1e5;
  const g = up[0] || overdue[0]; let text, key, cls = '';

}

    return {id, m, cnt, newborn, why, label: newborn ? 'Newborn (-K)' : (m && m.record_status.startsWith('termed') ? 'Termed record' : 'Linked record')};
  }).filter(Boolean);
}
function proxyFor(m) {
  const p = (m.hipaa_proxy || '').trim();
  return p && !/^none/i.test(p) ? p : '';

/* ---------- audit ---------- */
function audit(pid, action, evidence) {
  App.audit.unshift({t: clock(), pid, action, evidence: evidence || ''});
  renderDrawer();
}
function renderDrawer() {
  const d = document.getElementById('drawer'); d.classList.toggle('open', App.drawer);
  d.querySelector('.dh').setAttribute('aria-expanded', String(App.drawer));
  document.getElementById('auditCount').textContent = App.audit.length;
  const b = document.getElementById('auditBody');
  b.innerHTML = App.audit.length ? `<table><thead><tr><th>Time</th><th>User</th><th>Member</th><th>Action</th><th>Evidence shown</th></tr></thead><tbody>${App.audit.map(a => `<tr><td class="mono">${a.t}</td><td>${esc(S.case_manager.name)}</td><td>${a.pid ? esc((byId(a.pid) || {}).name || a.pid) : '—'}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.evidence)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No confirmations yet. Each Confirm writes a line here with user, time and the evidence shown.</div>`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- shell ---------- */
function renderShell(route) {

  document.getElementById('topbar').innerHTML = `
    <span>${DAY[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</span><span class="dot">·</span>
    <span class="mono" id="clock">${clock12()}</span><span class="dot">·</span>
    <span style="font-weight:500">${esc(cm.name)}</span><span class="dot">·</span>
    <span class="pill"${tipAttr('case_manager.active_cases')}>${cm.active_cases} active cases</span>
    <span class="pill alert"${tipAttr('case_manager.new_alerts_since_friday')}>${cm.new_alerts_since_friday} new alerts</span>
    <span class="grow"></span><span class="tiny muted">Synthetic data · no real PHI</span>`;
  document.getElementById('meName').textContent = cm.name;
  document.querySelectorAll('.nav a.item').forEach(a => {
    const k = a.dataset.nav; a.classList.toggle('active', route.view === k);

    if (k === 'outreach') a.href = '#outreach/' + (route.id || S.queue[0].patient_id);

  document.getElementById('navPatients').innerHTML = S.queue.map(q => `<a class="pt ${route.id === q.patient_id ? 'active' : ''}" href="#member/${q.patient_id}"><span class="rk">${q.rank}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.name)}</span></a>`).join('');
}

/* ============================ SCREEN 1: QUEUE ============================ */
function renderQueue() {

  const lowConf = S.queue.filter(q => confidence(q.patient_id) < 50).length;
  let list = S.queue.slice();
  if (App.unreach) list = list.filter(q => q.reachability.best_score < 0);
  if (App.sort === 'deadline') list.sort((a, b) => deadline(a.patient_id).key - deadline(b.patient_id).key);
  else if (App.sort === 'confidence') list.sort((a, b) => confidence(a.patient_id) - confidence(b.patient_id));
  else list.sort((a, b) => a.rank - b.rank);

  const cards = list.map(q => {
    const parts = priorityParts(q); const conf = confidence(q.patient_id); const dl = deadline(q.patient_id);
    const week = q.bucket !== 'Today';
    const sigs = q.signals.slice(0, 2);
    return `<article class="card qcard ${week ? 'week' : ''}" aria-label="${esc(q.name)}">

}

function timelineItems(q, ids) {
  const items = [];
  const rec = id => id === q.patient_id ? '' : id;
  rows('adt', ids).forEach(r => items.push({d: r.event_time, received: r.received_time, kind: 'ADT', title: `${r.event_type} — ${r.facility}`, detail: `MRN ${r.facility_mrn}${r.discharge_disposition ? ' · disposition ' + r.discharge_disposition : ''} · received ${r.hours_to_receipt} h after event`, id: r.member_id}));
  rows('claims', ids).forEach(r => items.push({d: r.service_date, received: r.received_date, kind: 'Claim', title: r.description, detail: `${r.claim_type} · ${r.place_of_service} · ${r.provider} · ICD-10 ${r.icd10} · ${r.cpt} · $${r.billed_usd.toLocaleString()}`, pending: r.visible_today === false, newborn: r.member_id.endsWith('-K'), id: r.member_id}));
  rows('pharmacy', ids).forEach(r => items.push({d: r.fill_date, received: r.fill_date, recNote: 'adjudicated at fill', kind: 'Pharmacy', title: `${r.drug} ${r.dose} — ${r.days_supply}-day supply`, detail: `${r.prescriber} · ${r.pharmacy} · ${/reversed/.test(r.claim_status) ? 'Not picked up — ' + r.claim_status.replace(/^reversed\s*—\s*/, '') : r.claim_status}`, id: r.member_id, bad: /reversed/.test(r.claim_status)}));
  rows('contact_history', ids).forEach(r => items.push({d: r.attempt_time, received: r.attempt_time, kind: 'Contact', title: `${r.channel} ${r.number_or_address} — ${r.outcome}`, detail: `${r.by} · ${r.note}`, id: r.member_id}));
  (App.contacts[q.patient_id] || []).forEach(r => items.push({d: r.attempt_time, received: r.attempt_time, kind: 'Contact', title: `${r.channel} ${r.number_or_address} — ${r.outcome}`, detail: `${r.by} · ${r.note}`, id: q.patient_id}));
  rows('clinical', ids).forEach(r => items.push({d: r.document_date, received: r.received_date, kind: 'Clinical', title: `${r.document} — ${r.source}`, detail: r.narrative_summary_received === 'No' ? 'Narrative summary not received' : r.content.slice(0, 140) + (r.content.length > 140 ? '…' : ''), id: r.member_id}));
  rows('labs', ids).forEach(r => items.push({d: r.result_date, received: r.result_date, recNote: 'via ' + r.source, kind: 'Lab', title: `${r.test}: ${r.value} ${r.unit}${r.flag ? ' (' + r.flag + ')' : ''}`, detail: r.source, id: r.member_id}));
  rows('rpm_home', ids).forEach(r => items.push({d: r.reading_time, received: r.reading_time, recNote: 'vendor portal only', kind: 'Home BP', title: `Home BP ${r.systolic}/${r.diastolic} mmHg`, detail: `${r.platform} · in EHR: ${r.in_ehr} · in plan feed: ${r.in_plan_feed} · alert fired: ${r.alert_fired}`, id: r.member_id, bad: r.systolic >= 160 || r.diastolic >= 110}));
  rows('um_auth', ids).forEach(r => items.push({d: r.requested, received: r.requested, kind: 'UM auth', title: `${r.auth_id} — ${r.service}`, detail: `${r.status}${r.decision_due ? ' · decision due ' + fmtD(r.decision_due) : ''}${r.expires ? ' · expires ' + fmtD(r.expires) : ''}`, id: r.member_id}));
  items.sort((a, b) => pd(b.d) - pd(a.d));
  return items;
}

function composeNote(pid) {

  lines.push(att ? `Reached ${att.number_or_address} by ${att.channel}.` : 'Contact: not yet reached.');

  if (pts.length) { lines.push('Discussed:'); pts.forEach(p => lines.push('  - ' + p.replace(/\s*[—–-]\s.*$/, '').replace(/\.$/, ''))); }

function consentChip(pid, numObj) {

let popEl = null;

const tipEl = document.getElementById('tip');
function showTip(el) { tipEl.textContent = el.getAttribute('data-tip'); tipEl.style.display = 'block'; const r = el.getBoundingClientRect(); const w = tipEl.offsetWidth; let x = r.left; if (x + w > window.innerWidth - 10) x = window.innerWidth - w - 10; let y = r.bottom + 8; if (y + tipEl.offsetHeight > window.innerHeight - 10) y = r.top - tipEl.offsetHeight - 8; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }

document.addEventListener('scroll', () => tipEl.style.display = 'none', true);

/* ============================ router / actions ============================ */
function route() { const h = location.hash.replace(/^#/, '') || 'queue'; const [view, id] = h.split('/'); const valid = id && byId(id); if (view === 'member' || view === 'outreach') return {view, id: valid ? id : S.queue[0].patient_id}; if (view === 'audit') return {view: 'audit'}; return {view: 'queue'}; }
function render() {
  closePop(); const r = route(); renderShell(r); const main = document.getElementById('main');
  if (r.view === 'queue') main.innerHTML = renderQueue();
  else if (r.view === 'member') main.innerHTML = renderMember(r.id);
  else if (r.view === 'outreach') main.innerHTML = renderOutreach(r.id);
  else { App.drawer = true; renderDrawer(); main.innerHTML = `<div class="crumb">Audit log</div><h1>Audit log</h1><p class="muted small" style="margin:4px 0 14px">Every confirmation this session, with user, time and the evidence shown. Also available from the drawer at the bottom of every screen.</p><div class="card" style="padding:4px 14px">${document.getElementById('auditBody').innerHTML}</div>`; }
  renderDrawer(); document.title = `${r.view === 'queue' ? 'Work queue' : r.view === 'member' ? byId(r.id).name + ' · Member 360' : r.view === 'outreach' ? byId(r.id).name + ' · Outreach' : 'Audit log'} · Case Workbench`;
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = clock12(); }, 15000);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) { if (!e.target.closest('.pop')) closePop(); return; }
  const a = el.dataset.action; const r = route(); const pid = r.id; const q = pid && byId(pid);
  if (a === 'drawer') { App.drawer = !App.drawer; renderDrawer(); return; }
  if (a === 'close-pop') { closePop(); return; }
  if (a === 'sort') { App.sort = el.dataset.sort; render(); return; }
  if (a === 'unreach') { App.unreach = el.checked; render(); return; }
  if (a === 'pop-rules') { openPop(el, `<h3>How is this scored?</h3><p class="small muted">Plain-English rules from the scoring engine (rules.*). The queue is capacity-aware: "Today" means score ≥ 65 <b>and</b> within the day's ${S.case_manager.capacity_today} outreach slots; everyone else is "This week".</p><h4 style="margin-top:10px">Priority, bucket (0–100)</h4><p>${esc(S.rules.priority)}</p><h4 style="margin-top:10px">Confidence (0–100)</h4><p>${esc(S.rules.confidence)}</p><h4 style="margin-top:10px">Human in the loop</h4><p>${esc(S.rules.human_in_loop)}</p>`); return; }
  if (a === 'pop-reach') { openPop(el, `<h3>Reachability score</h3><p>${esc(S.rules.reachability)}</p>`); return; }
  if (a === 'pop-conf') { openPop(el, `<h3>Why ${confidence(pid)}?</h3><p class="small muted">Starting score ${q.confidence}, from confidence_reasons:</p><ul>${q.confidence_reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${conflictState(pid).some(s => s === 'confirmed') ? `<p class="small">Lifted by confirmed conflicts: +${confidence(pid) - q.confidence}</p>` : ''}<h4 style="margin-top:8px">Rule</h4><p class="small">${esc(S.rules.confidence)}</p>`); return; }
  if (a === 'tab') { App.tab[pid] = el.dataset.tab; render(); return; }
  if (a === 'goto-conflict') { e.preventDefault(); const c = document.getElementById('conflict-' + el.dataset.i); if (c) { c.scrollIntoView({behavior: 'smooth', block: 'center'}); c.style.outline = '2px solid var(--accent)'; setTimeout(() => c.style.outline = '', 1600); } return; }
  if (a === 'confirm-line') { const t = clock(); App.confirmed[pid + ':line'] = t; audit(pid, 'Confirmed AI summary (8 am line)', q.eight_am_line.slice(0, 120) + '…'); render(); return; }
  if (a === 'confirm-nba') { const t = clock(); App.confirmed[pid + ':nba'] = t; audit(pid, 'Confirmed next best action', q.next_best_action + ' · trigger: ' + q.nba_trigger); render(); return; }
  if (a === 'confirm-conflict' || a === 'dismiss-conflict') {
    const i = +el.dataset.i; const c = q.conflicts[i]; const before = confidence(pid); const t = clock();
    conflictState(pid)[i] = a === 'confirm-conflict' ? 'confirmed' : 'dismissed'; App.confirmed[pid + ':c' + i] = t;
    const after = confidence(pid);
    audit(pid, a === 'confirm-conflict' ? `Confirmed conflict resolution: ${c.suggested}` : `Dismissed conflict: ${c.text}`, `${c.sources.join(' vs ')} · model ${Math.round(c.confidence * 100)}%` + (a === 'confirm-conflict' ? ` · confidence ${before} → ${after}` : ' · confidence unchanged'));
    if (a === 'confirm-conflict') toast(`Resolution confirmed · confidence ${before} → ${after}`);
    render(); return;
  }
  if (a === 'extract-lab') { App.labs[el.dataset.key] = 'extracted'; audit(pid, 'AI extraction run on scanned lab PDF', 'labs row with blank LOINC — value shown as AI draft'); render(); return; }
  if (a === 'confirm-lab') { const t = clock(); App.labs[el.dataset.key] = 'confirmed'; App.confirmed[el.dataset.key] = t; const l = T.labs[+el.dataset.key.split('lab')[1]]; audit(pid, `Confirmed extracted lab value: ${l.test} ${String(l.value).replace(/\s*—\s*unparsed/, '')} ${l.unit}`, l.source + ' · ' + fmtD(l.result_date)); render(); return; }
  if (a === 'create-task') { const t = clock(); audit(pid, 'Task created from next best action', q.next_best_action); toast(`Task created for ${q.name} · ${t}`); return; }
  if (a === 'mark-reviewed') { const t = clock(); App.confirmed[pid + ':reviewed'] = t; audit(pid, 'Member 360 marked reviewed', `confidence ${confidence(pid)} · ${conflictState(pid).filter(s => s === 'open').length} conflicts still open`); toast(`Marked reviewed · ${t}`); render(); return; }
  if (a === 'send-text') { const t = clock(); App.confirmed[pid + ':text'] = t; const P = PROFILE[pid]; const txt = App.text[pid] ?? P.text;
    (App.contacts[pid] = App.contacts[pid] || []).push({attempt_time: `${S.today.slice(0, 10)} ${t}`, channel: 'text', number_or_address: q.reachability.best_number, outcome: 'Text sent', by: S.case_manager.name, note: txt.slice(0, 80) + (txt.length > 80 ? '…' : '')});
    audit(pid, 'Text sent to ' + q.reachability.best_number, `TCPA: ${P.optin ? 'member opted in' : 'no opt-in on file (clinician override)'} · "${txt.slice(0, 90)}…"`); toast('Text sent and logged to Contact history'); render(); return; }
  if (a === 'log-attempt') { const d = App.attemptDraft[pid] || {number: q.reachability.best_number, outcome: 'Reached', note: ''}; const t = clock();
    const outcome = {'Reached': 'Reached — spoke with ' + (proxyFor(memberRow(pid)) && d.number === (memberRow(pid).phone_alt || '').slice(0, 8) ? 'proxy' : 'member'), 'Voicemail': 'Voicemail left', 'No answer': 'No answer', 'Not in service': 'Number not in service', 'Wrong person': 'Wrong person'}[d.outcome];
    (App.contacts[pid] = App.contacts[pid] || []).push({attempt_time: `${S.today.slice(0, 10)} ${t}`, channel: 'phone', number_or_address: d.number, outcome, by: S.case_manager.name, note: d.note || 'Outreach attempt'});
    audit(pid, `Attempt logged: ${d.number} — ${outcome}`, d.note || '');
    if (d.outcome === 'Reached') { App.reached[pid] = true; const f = fieldByKey(pid, 'reached_via'); if (f && !f.ok) f.value = `${d.number} by phone at ${t}`; toast('Reached — conversation guide opened'); } else toast('Attempt logged to Contact history');
    render(); return; }
  if (a === 'point') { const i = +el.dataset.i; const s = App.checks[pid]; el.checked ? s.add(i) : s.delete(i); document.getElementById('callnote').textContent = composeNote(pid); return; }
  if (a === 'confirm-field') { const k = el.dataset.k; const f = fieldByKey(pid, k); const inp = document.querySelector(`[data-field="${k}"]`); if (inp) f.value = inp.value.trim(); if (!f.value) { toast('Enter a value before confirming'); inp && inp.focus(); return; }
    const t = clock(); f.ok = true; App.confirmed[pid + ':f:' + k] = t; audit(pid, `Confirmed assessment field: ${f.label}`, `${f.value.slice(0, 100)} · source: ${f.src}`); render(); return; }
  if (a === 'confirm-section') { e.preventDefault(); const sec = sectionsFor(pid).find(x => x.name === el.dataset.sec); const t = clock(); const done = [];
    sec.fields.forEach(f => { const inp = document.querySelector(`[data-field="${f.key}"]`); if (inp && !f.ok) f.value = inp.value.trim(); if (f.pre && f.value && !f.ok) { f.ok = true; App.confirmed[pid + ':f:' + f.key] = t; done.push(f.label); } });
    if (done.length) { audit(pid, `Confirmed ${done.length} pre-filled fields — ${sec.name}`, done.join(', ')); toast(`${done.length} pre-filled fields confirmed in ${sec.name}`); }
    render(); return; }
  if (a === 'sign') { const fl = allFields(pid); const okN = fl.filter(x => x.ok).length; const t = clock(); App.signed[pid] = t;
    audit(pid, 'Confirm & sign — written once to assessment, care plan, note and audit form', `${okN}/${fl.length} fields confirmed · ${(App.checks[pid] || new Set()).size} talking points · goals: ${(App.goals[pid] ?? PROFILE[pid].goals).slice(0, 60)}…`);
    toast('Written once to assessment, care plan, note and audit form — no re-keying'); render(); return; }
});
document.addEventListener('input', e => {
  const r = route(); const pid = r.id; if (!pid) return;
  const b = e.target.dataset.bind;
  if (b === 'text') App.text[pid] = e.target.value;
  else if (b === 'goals') { App.goals[pid] = e.target.value; const cn = document.getElementById('callnote'); if (cn) cn.textContent = composeNote(pid); }
  else if (b) { App.attemptDraft[pid] = App.attemptDraft[pid] || {number: byId(pid).reachability.best_number, outcome: 'Reached', note: ''}; App.attemptDraft[pid][b] = e.target.value; }
  else if (e.target.dataset.field) { const f = fieldByKey(pid, e.target.dataset.field); if (f) f.value = e.target.value; }
});
document.addEventListener('change', e => { if (e.target.dataset.bind && e.target.tagName === 'SELECT') { const pid = route().id; App.attemptDraft[pid] = App.attemptDraft[pid] || {number: byId(pid).reachability.best_number, outcome: 'Reached', note: ''}; App.attemptDraft[pid][e.target.dataset.bind] = e.target.value; } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.sec')) { const pid = route().id; const set = App.secOpen[pid]; if (set) d.open ? set.add(d.dataset.sec) : set.delete(d.dataset.sec); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
render();
</script>
</body>
</html>
