<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Management Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f3; --card:#ffffff; --ink:#1b2426; --muted:#5d6a6c; --faint:#8a9497; --line:#e2e5e0; --line-strong:#cfd4ce;
  --accent:#0e5c62; --accent-ink:#0a4549; --accent-soft:#e2eff0; --accent-mid:#4e9196; --accent-light:#a8cfd2;
  --red:#b3232d; --red-soft:#fbe9ea; --red-line:#f0c3c6;
  --amber:#8f5a00; --amber-soft:#fff2d4; --amber-line:#f3d896;
  --green:#1f7a3f; --green-soft:#e3f3e8; --green-line:#b9e0c4;
  --grey:#636b70; --grey-soft:#eef0f1; --grey-line:#d7dbde;
  --purple:#5b3f9e; --purple-soft:#efeaf9;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,30,.05),0 1px 1px rgba(20,30,30,.03);
  --nav-w:224px; --top-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px} h4{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
ol.steps{margin:6px 0 0;padding-left:20px} ol.steps li{margin:4px 0;font-size:13.5px;line-height:1.45}

/* shell */
.nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand .t{font-weight:600;font-size:14px;line-height:1.15}
.brand .s{font-size:11.5px;color:var(--muted)}
.nav a.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.nav a.item:hover{background:var(--grey-soft)}
.nav a.item.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav a.item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .sec{margin:18px 10px 6px}
.nav a.pt{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px}
.nav a.pt:hover{background:var(--grey-soft)}
.nav a.pt.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav a.pt .rk{width:18px;height:18px;border-radius:5px;background:var(--grey-soft);color:var(--muted);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.nav a.pt.active .rk{background:var(--accent);color:#fff}
.nav .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.top{position:fixed;left:var(--nav-w);right:0;top:0;height:var(--top-h);background:rgba(245,246,243,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:9px;z-index:15;font-size:13px;white-space:nowrap;overflow:hidden}
.top .dot{color:var(--faint)}
.top .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.top .pill.alert{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber)}
.top .grow{flex:1}
main{margin-left:var(--nav-w);padding:calc(var(--top-h) + 18px) 28px 120px;max-width:1440px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{text-decoration:underline}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--grey-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green);cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;line-height:1.5;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.chip.ai{background:var(--purple-soft);color:var(--purple);border-color:#d9cff0}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.green{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.grey{background:var(--grey-soft);color:var(--grey);border-color:var(--grey-line)}
.chip.teal{background:var(--accent-soft);color:var(--accent-ink);border-color:#bcd9db}
.chip.purple{background:var(--purple-soft);color:var(--purple);border-color:#d9cff0}
.chip.wrap{white-space:normal;line-height:1.35;padding:3px 9px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:6px}
[data-tip]{cursor:help}
.tip{position:fixed;z-index:100;max-width:360px;background:#1b2426;color:#fff;font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;display:none;white-space:pre-line}
.pop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,20,.15);padding:14px 16px;width:520px;max-width:calc(100vw - 40px);font-size:13px;line-height:1.5;max-height:70vh;overflow:auto}
.pop h3{margin-bottom:6px}
.pop .close{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:16px;color:var(--muted)}
.pop ul{margin:4px 0 10px 18px;padding:0} .pop li{margin:2px 0}
.pop table td{font-size:12.5px;vertical-align:top}
.bar{height:8px;background:var(--grey-soft);border-radius:999px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .s0{background:var(--accent)} .bar .s1{background:var(--accent-mid)} .bar .s2{background:var(--accent-light)}
.cbar{height:8px;background:var(--grey-soft);border-radius:999px;overflow:hidden}
.cbar>i{display:block;height:100%}
.c-red>i{background:var(--red)} .c-amber>i{background:#d99a1e} .c-green>i{background:var(--green)}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend b{color:var(--ink);font-weight:600}
.legend .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.hl td{background:#fff8ec}
tr.dim td{color:var(--faint)}
tr.masked td{color:var(--faint);font-style:italic;background:#fafafa}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#1b2426;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:all .25s;z-index:90;max-width:640px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:60px;line-height:1.45}
textarea:disabled,input:disabled,select:disabled{background:var(--grey-soft);color:var(--faint)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.fz{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:0 4px 0 5px;border-left:3px solid var(--grey-line);line-height:1.3;white-space:nowrap}
.fz.g{border-left-color:var(--green)} .fz.a{border-left-color:#d99a1e} .fz.x{border-left-color:#b9c0c4}
.fz b{color:var(--ink);font-weight:600}

/* queue */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0 18px}
.stat{padding:13px 15px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.stat.warn .v{color:var(--red)}
.qbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;cursor:pointer}
.qcard{display:grid;grid-template-columns:118px 1.25fr 1.05fr .75fr 1.4fr;gap:16px;padding:16px 18px;align-items:start;margin-bottom:10px}
.qcard.week{opacity:.9;background:#fbfbf9}
.bucket{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:4px 8px;line-height:1.3;text-align:center}
.bucket.deadline{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.bucket.today{background:var(--accent-soft);color:var(--accent-ink);border:1px solid #bcd9db}
.bucket.tomorrow{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.bucket.week{background:var(--grey-soft);color:var(--grey);border:1px solid var(--grey-line)}
.qcard .nm{font-size:16px;font-weight:600;line-height:1.2}
.qcard .nm a{color:inherit;text-decoration:none} .qcard .nm a:hover{text-decoration:underline}
.qcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
.lab b{color:var(--ink);font-size:13px;letter-spacing:0;text-transform:none}
.dl{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.dl.hot{color:var(--red)} .dl.warm{color:var(--amber)}
.dl-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.nba{font-size:13.5px;line-height:1.45}
.nba .act{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.rest{margin-top:18px}
details.rest summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 14px;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.rest summary::-webkit-details-marker{display:none}
details.rest summary::before{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.rest[open] summary::before{transform:rotate(45deg)}
.simgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding:0 14px 14px}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 0 0}
.hist .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.hist .b i{display:block;width:100%;background:var(--accent-light);border-radius:3px 3px 0 0}
.hist .b b{font-size:11.5px;color:var(--ink);margin-bottom:2px}
.simtbl{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.simtbl td,.simtbl th{padding:5px 9px;font-size:12.5px}

/* member */
.m360{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}
.idh{padding:12px 18px}
.idh .nm{font-size:20px;font-weight:600;letter-spacing:-.01em}
.idh .meta{font-size:13px;color:var(--muted);margin-top:4px}
.idh .meta b{color:var(--ink);font-weight:500}
.idh .phones{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;align-items:center}
.idh .phones .ph{display:inline-flex;align-items:center;gap:6px}
.idh .phones .ph .n{font-weight:500}
.lead{padding:10px 18px;margin-top:8px;border-left:4px solid var(--accent)}
.lead p.txt{font-size:14px;line-height:1.45;margin-top:5px}
.conf{padding:8px 18px;margin-top:8px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center}
.conf .n{font-size:22px;font-weight:600;min-width:42px;text-align:right;letter-spacing:-.02em}
.conf .n.red{color:var(--red)} .conf .n.amber{color:var(--amber)} .conf .n.green{color:var(--green)}
.fzrow{grid-column:1 / -1;display:flex;gap:6px 9px;flex-wrap:wrap;padding-top:5px;border-top:1px dashed var(--line)}
.sig{padding:7px 18px;margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sig ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;flex:1}
.sig li{display:flex;gap:8px;align-items:center;font-size:13px}
.verify{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
.vc{padding:8px 12px;border-left:4px solid var(--amber);display:flex;flex-direction:column;gap:5px}
.vc.high{border-left-color:var(--red)} .vc.low{border-left-color:var(--grey)}
.vc.done{border-left-color:var(--green);background:#f7fcf8}
.vc .src{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:11.5px}
.vc .src.one{grid-template-columns:1fr}
.vc .src>div{background:var(--grey-soft);border-radius:6px;padding:4px 7px;line-height:1.3}
.vc .src>span{color:var(--faint);font-size:11px}
.vc .txt{font-size:13px;font-weight:500;line-height:1.35}
.vc .act{font-size:12px;color:var(--muted);line-height:1.35}
.vc .act b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabpanel{padding:16px 20px;margin-top:12px}
.feed{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:8px 12px;background:var(--grey-soft);border-radius:8px;margin-bottom:12px;align-items:center}
.feed b{color:var(--ink);font-weight:500}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:6px 122px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.tl li:last-child{border-bottom:0}
.tl .band{width:6px;border-radius:3px;align-self:stretch;min-height:36px}
.band.g{background:var(--green)} .band.a{background:#d99a1e} .band.x{background:#b9c0c4} .band.p{background:repeating-linear-gradient(0deg,#cfd4d7 0 4px,transparent 4px 8px)} .band.m{background:repeating-linear-gradient(45deg,#d9cff0 0 4px,transparent 4px 8px)}
.tl .when{font-size:12.5px;line-height:1.4}
.tl .when b{font-weight:600;display:block}
.tl .when span{color:var(--muted);display:block;font-size:11.5px}
.tl .what{font-size:13.5px;line-height:1.45}
.tl .what .d{color:var(--muted);font-size:12.5px}
.tl li.pending .what,.tl li.pending .when{color:var(--faint)}
.tl li.pending .what .d{color:var(--faint)}
.tl li.newborn .what{background:#f3f0fb;border-radius:6px;padding:6px 9px;border:1px dashed #cfc2ea}
.tl li.masked .what{background:#fafafa;border:1px dashed var(--grey-line);border-radius:6px;padding:6px 9px;color:var(--faint);font-style:italic}
.kind{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);background:var(--grey-soft);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;border:1px solid;flex-wrap:wrap}
.banner.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.banner.amber{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.banner.grey{background:var(--grey-soft);border-color:var(--grey-line);color:var(--muted)}
.doc{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.doc .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.doc .c{font-size:13px;line-height:1.55;margin-top:6px;color:#2b3537}
.gap{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.gap:last-child{border-bottom:0}
.gap .t{font-weight:500;font-size:13.5px}
.gap .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.gap .due{text-align:right;font-size:12.5px;white-space:nowrap}
.gap .due b{display:block;font-size:14px;font-weight:600}
.note{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13.5px;line-height:1.5}
.note .h{font-size:12px;color:var(--muted);margin-bottom:3px}
.rail{position:sticky;top:calc(var(--top-h) + 20px);display:flex;flex-direction:column;gap:12px}
.rail .card{padding:14px 16px}
.rail .why{font-size:12.5px;color:var(--muted)}
.reach .num{font-size:19px;font-weight:600;letter-spacing:-.01em}
.reach .numrow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;margin-top:6px}
.reach .numrow .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.reach ul{margin:6px 0 0 16px;padding:0;font-size:12.5px;color:var(--muted)}
.rail .acts{display:flex;flex-direction:column;gap:8px}
.rail .acts .btn{justify-content:center}

/* outreach */
.o3{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.o3 .card{padding:14px 16px}
.numcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative}
.numcard.best{border-color:var(--accent);background:#f3f9f9;box-shadow:inset 3px 0 0 var(--accent)}
.numcard.dead{opacity:.7}
.numcard .n{font-size:17px;font-weight:600;letter-spacing:-.01em}
.numcard .sc{font-size:12px;color:var(--muted)}
.numcard .sc b{font-size:14px;color:var(--ink)}
.numcard ul{margin:6px 0 0 16px;padding:0;font-size:12.5px;color:var(--muted)}
.numcard ul li.neg{color:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.split>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.split .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.split .n{font-size:16px;font-weight:600}
.locked{position:relative;min-height:240px}
.locked .veil{position:absolute;inset:0;background:rgba(245,246,243,.85);display:grid;place-items:center;text-align:center;padding:20px;border-radius:var(--radius);font-size:13.5px;color:var(--muted);z-index:2}
.tp{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.tp:last-child{border-bottom:0}
.tp .src{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.tp .q{font-weight:500}
.tp .ans{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:6px;align-items:center}
.tp .ans input{font-size:12.5px;padding:6px 9px}
.tp.done{background:#f7fcf8;margin:0 -8px;padding:10px 8px;border-radius:6px}
.tp.cnv{background:#fbfbf9;margin:0 -8px;padding:10px 8px;border-radius:6px}
details.sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details.sec summary{list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:9px 12px;cursor:pointer;font-size:13.5px;font-weight:600;border-radius:8px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.sec[open] summary::before{transform:rotate(45deg)}
details.sec summary:hover{background:var(--grey-soft)}
details.sec summary .sn{white-space:nowrap;min-width:0}
details.sec summary .sc{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap} details.sec summary .sc.done{color:var(--green)}
details.sec summary .grow{flex:1}
.fld{padding:7px 12px;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.fld .k{font-size:12px;font-weight:600;color:var(--muted)}
.fld .v{display:flex;flex-direction:column;gap:3px}
.fld .v textarea{font-size:13px;padding:6px 9px;min-height:0;line-height:1.4}
.fld .v .srcl{font-size:11px;color:var(--faint)}
.fld .v .prompt{font-size:12px;color:var(--amber)}
.fld.ok .v textarea{background:var(--green-soft);border-color:var(--green-line)}
.callnote{background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;min-height:90px;color:#2b3537}
.counter{font-size:12.5px;color:var(--muted)}
.counter b{color:var(--ink)}

/* drawer */
.drawer{position:fixed;left:var(--nav-w);right:0;bottom:0;background:#fff;border-top:1px solid var(--line-strong);box-shadow:0 -6px 20px rgba(10,20,20,.08);z-index:18}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:8px 28px;border:0;background:transparent;width:100%;text-align:left;font-size:13px;font-weight:500}
.drawer .dh .cnt{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.drawer .body{max-height:220px;overflow:auto;padding:0 28px 14px;display:none}
.drawer.open .body{display:block}
.drawer table td{padding:6px 10px;font-size:12.5px}
.drawer .body .empty{padding:14px}
.chev{transition:transform .2s;display:inline-block}
.drawer.open .chev{transform:rotate(180deg)}
</style>

<script>
/* ============================================================
   Case Management Workbench — clickable prototype (brief v4, data v3)
   Every value on screen is read from the embedded workbench_state.json.
   ============================================================ */
const S = JSON.parse(document.getElementById('state').textContent);
const T = S.tables; const SIM = S.caseload_simulation; const CM = S.case_manager;
const TODAY = new Date(S.today.replace(' ', 'T'));
const LOAD = Date.now();
const FIRST = CM.name.split(',')[0].split(' ')[0];   // "Maria"

/* ---------- in-memory app state (reload resets) ---------- */
const App = {
  sort: 'display', unreach: false, tab: {}, drawer: false, audit: [], restOpen: false,
  contacts: {}, reached: {}, noAnswer: {}, handoff: {}, linkOk: new Set(), labs: {},
  call: {}, assess: {}, secOpen: {}, goals: {}, text: {}, textNum: {}, signed: {}, attemptDraft: {}, reviewed: {}, tasks: {}, textSent: {}
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pd = s => s ? new Date(String(s).replace(' ', 'T')) : null;
const fmtD = s => { const d = pd(s); return d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : '—'; };
const fmtDs = s => { const d = pd(s); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : '—'; };
const fmtDT = s => { const d = pd(s); if (!d) return '—'; const hasT = /\d:\d/.test(String(s)); return `${d.getDate()} ${MON[d.getMonth()]}${hasT ? ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''}`; };
const dayDiff = (a, b) => Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate()) - new Date(b.getFullYear(),b.getMonth(),b.getDate())) / 864e5);
const ageDays = s => dayDiff(TODAY, pd(s));
function clock() { const d = new Date(TODAY.getTime() + 4 * 60000 + (Date.now() - LOAD)); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const clock12 = () => { const [h, m] = clock().split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'am' : 'pm'}`; };
const byId = id => S.queue.find(q => q.patient_id === id);
const memberRow = id => T.member.find(m => m.member_id === id);
const sevChip = sev => sev === 'high' ? 'red' : sev === 'medium' ? 'amber' : 'grey';
const confCls = c => c < 50 ? 'red' : c < 75 ? 'amber' : 'green';
const tipAttr = s => ` data-tip="${esc(s)}"`;
const aiChip = (t = 'AI draft') => `<span class="chip ai"${tipAttr('Produced by the workbench from the records shown. Confirmed only on the outreach screen after the member is reached.')}>${t}</span>`;
const okChip = t => `<span class="chip ok">Clinician confirmed · ${FIRST} · ${t}</span>`;
const baseId = mid => String(mid).replace(/-[A-Z]$/, '');
const isNewborn = mid => /-[A-Z]$/.test(String(mid));
const linkedIdsOf = q => q.linked_records.map(l => l.member_id);
const masked = (pid, mid) => linkedIdsOf(byId(pid)).includes(baseId(mid)) && !App.linkOk.has(pid);
function rowsFor(table, pid, includeMasked) { const q = byId(pid); return (T[table] || []).filter(r => q.linked_ids.includes(baseId(r.member_id)) && (includeMasked || !masked(pid, r.member_id))); }
function band(dateStr, isClaim) { const a = ageDays(dateStr); const [g, am] = isClaim ? [45, 90] : [7, 45]; const w = isClaim ? ['≤ 45 d', '46–90 d', '> 90 d'] : ['≤ 7 d', '8–45 d', '> 45 d']; return a <= g ? {b: 'g', l: `${a} d`, w: w[0]} : a <= am ? {b: 'a', l: `${a} d`, w: w[1]} : {b: 'x', l: `${a} d`, w: w[2]}; }
function countdown(q) { const h = q.hours_to_nearest_window; if (h == null || h >= 1e5) return 'no window'; if (h < 24) return `${Math.round(h)} h`; const d = Math.round(h / 24); return d === 1 ? '1 day' : `${d} days`; }
function nearestWindow(pid) { return rowsFor('care_gaps', pid, true).filter(g => g.kind === 'clinical' && g.open_window && pd(g.due_datetime) >= TODAY).sort((a, b) => pd(a.due_datetime) - pd(b.due_datetime))[0]; }
function priorityParts(q) { const max = {Urgency: 50, Acuity: 35, Signals: 15}; return q.priority_reasons.map(r => { const m = r.match(/^(\w+)\s+(\d+):\s*(.*)$/); return m ? {name: m[1], val: +m[2], why: m[3], max: max[m[1]] || 50} : {name: r, val: 0, why: '', max: 50}; }); }
function datasetFreshness(pid) {
  const defs = [['PBM', 'pharmacy', 'visible_in_extract', false], ['ADT', 'adt', 'received_time', false], ['Claims', 'claims', 'received_date', true], ['Clinical', 'clinical', 'received_date', false], ['Labs', 'labs', 'result_date', false], ['Home BP', 'rpm_home', 'received_time', false], ['Contact', 'contact_history', 'attempt_time', false], ['Appts', 'appointments', 'as_of', false]];
  return defs.map(([name, t, f, c]) => { const rs = rowsFor(t, pid, true).filter(r => r[f] && (t !== 'claims' || r.visible_today)); if (!rs.length) return {name, none: true}; const latest = rs.map(r => r[f]).sort().slice(-1)[0]; return {name, latest, field: f, ...band(latest, c)}; });
}
const fzChips = pid => datasetFreshness(pid).map(z => z.none ? `<span class="fz x"${tipAttr(z.name + ': no rows for this member')}>${z.name} <b>—</b></span>` : `<span class="fz ${z.b}"${tipAttr(z.name + ' · latest ' + z.field + ' ' + fmtDT(z.latest) + ' · ' + z.w)}>${z.name} <b>${z.l}</b></span>`).join('');

/* ---------- audit ---------- */
function audit(pid, action, evidence) { App.audit.unshift({t: clock(), pid, action, evidence: evidence || ''}); renderDrawer(); }
function renderDrawer() {
  const d = document.getElementById('drawer'); d.classList.toggle('open', App.drawer); d.querySelector('.dh').setAttribute('aria-expanded', String(App.drawer));
  document.getElementById('auditCount').textContent = App.audit.length;
  document.getElementById('auditBody').innerHTML = App.audit.length ? `<table><thead><tr><th>Time</th><th>User</th><th>Member</th><th>Action</th><th>Evidence shown</th></tr></thead><tbody>${App.audit.map(a => `<tr><td class="mono">${a.t}</td><td>${esc(CM.name)}</td><td>${a.pid ? esc((byId(a.pid) || {}).name || a.pid) : '—'}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.evidence)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No confirmations yet. Each Confirm on the outreach screen writes a line here with user, time and the evidence shown.</div>`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- shell ---------- */
function renderShell(route) {
  const d = TODAY; const [shift, evening] = CM.shift.split(';').map(s => s.trim());
  document.getElementById('topbar').innerHTML = `
    <span>${DAY[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</span><span class="dot">·</span>
    <span class="mono" id="clock">${clock12()}</span><span class="dot">·</span>
    <span style="font-weight:500">${esc(CM.name)}</span><span class="dot">·</span>
    <span${tipAttr('case_manager.shift')}>shift ${esc(shift)}</span><span class="dot">·</span>
    <span${tipAttr('case_manager.shift')}>${esc(evening.replace('evening outreach team', 'evening team'))}</span><span class="dot">·</span>
    <span class="pill"${tipAttr('case_manager.active_cases')}>${CM.active_cases} active cases</span>
    <span class="pill alert"${tipAttr('case_manager.new_alerts_since_friday')}>${CM.new_alerts_since_friday} new alerts</span>
    <span class="grow"></span><span class="tiny muted">Synthetic data · no real PHI</span>`;
  document.getElementById('meName').textContent = CM.name;
  document.querySelectorAll('.nav a.item').forEach(a => { const k = a.dataset.nav; a.classList.toggle('active', route.view === k); if (k === 'member') a.href = '#member/' + (route.id || S.queue[0].patient_id); if (k === 'outreach') a.href = '#outreach/' + (route.id || S.queue[0].patient_id); });
  document.getElementById('navPatients').innerHTML = S.queue.map((q, i) => `<a class="pt ${route.id === q.patient_id ? 'active' : ''}" href="#member/${q.patient_id}"><span class="rk">${i + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.name)}</span></a>`).join('');
}

/* ============================ SCREEN 1: QUEUE ============================ */
const bucketCls = b => /deadline/i.test(b) ? 'deadline' : /tomorrow/i.test(b) ? 'tomorrow' : /^today/i.test(b) ? 'today' : 'week';
function renderQueue() {
  const sparse = S.queue.filter(q => q.confidence < 50).length;
  let list = S.queue.map((q, i) => ({q, i}));
  if (App.unreach) list = list.filter(x => x.q.reachability.best_score < 0);
  if (App.sort === 'window') list.sort((a, b) => (a.q.hours_to_nearest_window ?? 1e9) - (b.q.hours_to_nearest_window ?? 1e9));
  else if (App.sort === 'confidence') list.sort((a, b) => a.q.confidence - b.q.confidence);
  else list.sort((a, b) => a.i - b.i);
  const cards = list.map(({q, i}) => {

    const eveningDemo = q.reachability.evening_handoff && App.handoff[pid] && d.number === q.reachability.best_number; if (eveningDemo) { t = '18:05'; by = 'Evening outreach team (demo)'; }
    const numObj = q.reachability.all_numbers.find(n => n.number === d.number) || {}; const who = numObj.label ? ` (${numObj.label})` : '';
    const outcome = {'Reached': 'Reached — spoke with ' + (numObj.label ? numObj.label : 'member'), 'Voicemail': 'Voicemail left', 'No answer': 'No answer', 'Not in service': 'Number not in service', 'Wrong person': 'Wrong person', 'Relay asked to call back': 'Relay — asked to have the member call back (no PHI)'}[d.outcome];
    logContact(pid, {attempt_time: `${S.today.slice(0, 10)} ${t}`, channel: 'phone', number_or_address: d.number + who, outcome, by, note: d.note || 'Outreach attempt'});
    audit(pid, `Attempt logged: ${d.number} — ${outcome}`, d.note || (eveningDemo ? 'evening-team attempt (demo)' : ''));
    if (d.outcome === 'Reached') { App.reached[pid] = true; toast('Reached — the call and documentation are open'); } else { if (/No answer|Voicemail/.test(d.outcome)) App.noAnswer[pid] = true; toast('Attempt logged'); }
    render(); return; }
  if (a === 'confirm-item') { const i = +el.dataset.i; const cs = callState(pid); const inp = document.querySelector(`[data-said="${i}"]`); const said = (inp ? inp.value : cs.items[i].said).trim(); if (!said) { toast('Enter what the member said before confirming'); inp && inp.focus(); return; }
    const v = q.verify_on_call[i]; const t = clock(); cs.items[i] = {status: 'confirmed', said, t};
    audit(pid, `Verified on call: ${v.text}`, `${v.sources.join(' vs ')} · member: "${said}"`);
    if (v.type === 'identity' && q.linked_records.length) { App.linkOk.add(pid); audit(pid, `Linked record ${q.linked_records.map(l => l.member_id).join(', ')} confirmed — rows unmasked`, q.linked_records.map(l => l.evidence.join(' · ')).join('; ')); toast('Linked record confirmed — its rows are now visible across the app'); }
    else toast('Item confirmed and logged');
    render(); return; }
  if (a === 'cnv-item') { const i = +el.dataset.i; const cs = callState(pid); const v = q.verify_on_call[i]; const t = clock(); cs.items[i] = {status: 'cnv', said: '', t}; audit(pid, `Could not verify on call: ${v.text}`, v.sources.join(' vs ')); render(); return; }
  if (a === 'confirm-q') { const i = +el.dataset.i; const cs = callState(pid); const inp = document.querySelector(`[data-answer="${i}"]`); const ans = (inp ? inp.value : '').trim(); if (!ans) { toast("Enter the member's answer before confirming"); inp && inp.focus(); return; }
    const x = scriptedQuestions(q)[i]; cs.qs[i] = {answer: ans, ok: true, t: clock()}; audit(pid, `Asked: ${x.q}`, `from signal: ${x.from} · answer: "${ans}"`); render(); return; }
  if (a === 'task-step') { const s = q.next_best_action[+el.dataset.i]; addTask(pid, s, 'next_best_action[' + el.dataset.i + ']'); toast('Task created'); render(); return; }
  if (a === 'confirm-section') { e.preventDefault(); const sec = assessment(pid).find(x => x.name === el.dataset.sec); const t = clock(); const done = [];
    sec.fields.forEach(f => { const inp = document.querySelector(`[data-field="${f.idx}"]`); if (inp && !f.ok) f.value = inp.value.trim(); if (f.value && !f.ok) { f.ok = true; f.t = t; done.push(`${f.label} (${f.cls})`); } });
    if (done.length) { audit(pid, `Confirmed section ${sec.name} — ${done.length} field${done.length > 1 ? 's' : ''}`, done.join(', ')); toast(`${sec.name}: ${done.length} fields confirmed`); } else toast('Nothing filled in this section yet');
    render(); return; }
  if (a === 'sign') { const fl = allFields(pid); const okN = fl.filter(x => x.ok).length; const t = clock(); App.signed[pid] = t;
    audit(pid, 'Confirm & sign — written once to assessment, care plan, note and audit form', `${okN}/${fl.length} fields confirmed · ${callState(pid).items.filter(x => x.status !== 'open').length} verify items · ${(App.tasks[pid] || []).length} tasks`);
    toast('Written once to assessment, care plan, note and audit form'); render(); return; }
});
document.addEventListener('input', e => {
  const r = route(); const pid = r.id; if (!pid) return; const b = e.target.dataset.bind;
  if (b === 'text') App.text[pid] = e.target.value;
  else if (b === 'goals') { App.goals[pid] = e.target.value; const cn = document.getElementById('callnote'); if (cn) cn.textContent = composeNote(pid); }
  else if (b) { App.attemptDraft[pid] = App.attemptDraft[pid] || {number: byId(pid).reachability.daytime_number, outcome: 'Reached', note: ''}; App.attemptDraft[pid][b] = e.target.value; }
  else if (e.target.dataset.field) { const f = fieldByIdx(pid, e.target.dataset.field); if (f) { f.value = e.target.value; f.edited = true; } }
  else if (e.target.dataset.said != null) { callState(pid).items[+e.target.dataset.said].said = e.target.value; }
  else if (e.target.dataset.answer != null) { callState(pid).qs[+e.target.dataset.answer].answer = e.target.value; }
});
document.addEventListener('change', e => { const b = e.target.dataset.bind; if (b && e.target.tagName === 'SELECT') { const pid = route().id; if (b === 'textNum') { App.textNum[pid] = e.target.value; return; } App.attemptDraft[pid] = App.attemptDraft[pid] || {number: byId(pid).reachability.daytime_number, outcome: 'Reached', note: ''}; App.attemptDraft[pid][b] = e.target.value; } });
document.addEventListener('toggle', e => { const d = e.target; if (!d.matches) return; if (d.matches('details.sec')) { const pid = route().id; const set = App.secOpen[pid]; if (set) d.open ? set.add(d.dataset.sec) : set.delete(d.dataset.sec); } else if (d.matches('details.rest')) App.restOpen = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
render();
</script>
